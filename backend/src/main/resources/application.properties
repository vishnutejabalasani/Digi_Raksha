# Server Port Configuration (Render uses $PORT dynamically)
server.port=${PORT:8080}

# Database Configuration
# Defaults to in-memory H2 database for zero-config instant deployment on Render!
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:mem:digiraksha;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Key Config
security.jwt.secret=${JWT_SECRET:secret-cyber-key-must-be-very-long-and-secure-for-hmac-sha-256-encryption-key-for-digiraksha-application}
security.jwt.expiration-ms=86400000


